# Flatpak of mb3d-rs (Flathub: io.github.thr32423.mb3d-rs).
#
# Built from source: the Rust programs from this repository, MB3D's
# formulas, maps and parameter files from thargor6/mb3d (the commit the
# release archives use, MB3D-SOURCE.txt). The programs find these in
# /app/share/mb3d-rs and keep the user's settings and History in
# ~/.var/app/io.github.thr32423.mb3d-rs (src/appdirs.rs: installed way).
#
# cargo-sources.json lists the crates of Cargo.lock for the offline build;
# it is made with flatpak-cargo-generator.py (flatpak-builder-tools) and
# kept only in the Flathub repository, not here.
#
# The command line renderer: flatpak run --command=mb3d io.github.thr32423.mb3d-rs
id: io.github.thr32423.mb3d-rs
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: Mandelbulb3D
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # the graphics card (Vulkan) for the calculation
  - --device=dri
  # parameter files and pictures anywhere in the home folder: the program
  # has MB3D's own file dialogs, which cannot use the file chooser portal
  - --filesystem=home
modules:
  - name: mb3d-rs
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/mb3d-rs/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/Mandelbulb3D target/release/mb3d -t /app/bin
      - install -d /app/share/mb3d-rs/examples
      - cp -r Themes /app/share/mb3d-rs/
      - install -Dm644 examples/*.m3s -t /app/share/mb3d-rs/examples
      - install -Dm644 assets/mb3d-rs.png /app/share/icons/hicolor/256x256/apps/io.github.thr32423.mb3d-rs.png
      - install -Dm644 assets/mb3d-rs-64.png /app/share/icons/hicolor/64x64/apps/io.github.thr32423.mb3d-rs.png
      - install -Dm644 assets/mb3d-rs-48.png /app/share/icons/hicolor/48x48/apps/io.github.thr32423.mb3d-rs.png
      - install -Dm644 assets/mb3d-rs.desktop /app/share/applications/io.github.thr32423.mb3d-rs.desktop
      - desktop-file-edit --set-icon=io.github.thr32423.mb3d-rs /app/share/applications/io.github.thr32423.mb3d-rs.desktop
      - install -Dm644 packaging/flatpak/io.github.thr32423.mb3d-rs.metainfo.xml -t /app/share/metainfo
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.thr32423.mb3d-rs
    sources:
      - type: git
        url: https://github.com/thr32423/mb3d-rs.git
        tag: v0.2.45
      - cargo-sources.json

  # MB3D's formulas, maps and example parameters (LGPL-2.1)
  - name: mb3d-data
    buildsystem: simple
    build-commands:
      - install -d /app/share/mb3d-rs
      - cp -r M3Formulas M3Maps M3Parameter EM_JIT_M3Formulas /app/share/mb3d-rs/
      - install -Dm644 License.txt /app/share/licenses/io.github.thr32423.mb3d-rs/MB3D-License.txt
    sources:
      - type: git
        url: https://github.com/thargor6/mb3d.git
        commit: 26de069672c385e4c75e20b8a6cdfb21b3e86c82
