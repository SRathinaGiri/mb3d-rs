name: Release

# push a tag like v0.2.0 to build the binaries and attach them to a release
on:
  push:
    tags: ["v*"]
  # run by hand with a tag: builds that tag again and adds the packages a
  # release made before is missing (the .rpm) to its release
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to add missing packages to (empty: just build)"
        required: false
        default: ""

permissions:
  contents: write
  # build provenance attestations of the archives (gh attestation verify)
  id-token: write
  attestations: write

env:
  # the tag being released (pushed, or given by hand)
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # oidn: Intel Open Image Denoise's release package for the system
          # and its SHA-256 (the Monte Carlo renders' neural noise filter,
          # shipped whole in the package's oidn/ folder)
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "", asset: linux-x64,
              oidn: oidn-2.5.1.x86_64.linux.tar.gz, oidn_sha: 743c3e2aff8c220d5d70fe6cb970fb3d36f2702d2693c61d1d148e404cf37cd6 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe", asset: windows-x64,
              oidn: oidn-2.5.1.x64.windows.zip, oidn_sha: f11f91bc072a5e3a564515724cb72ab8fcfbc445c84a84c197ff9b16cc01396f }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "", asset: macos-arm64,
              oidn: oidn-2.5.1.arm64.macos.tar.gz, oidn_sha: 98e0aca8e7ab69e9f4f0191582a500fd8b0d9085d68662f18ab6469e934a6efd }
          # Intel Macs: cross-compiled on the Apple silicon runner (the
          # Intel macOS runners are retired)
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "", asset: macos-x64,
              oidn: oidn-2.5.1.x86_64.macos.tar.gz, oidn_sha: a4341639005a33ce0d944bd7c771ce34de1465be7eb3189b7c3b5b0064429832 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # the packaging scripts of this workflow's commit (by hand, the tag's
      # own may be older)
      - uses: actions/checkout@v7
        with:
          path: ci
          sparse-checkout: tools
      # the original Mandelbulb3D folder (formulas, maps, parameters, sources)
      # is shipped next to the program
      - uses: actions/checkout@v7
        with:
          repository: thargor6/mb3d
          path: mb3d-original
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Windows: mach-dxcompiler-rs (the DirectX shader compiler) asks the
      # GitHub API with curl, without a token, whether its download is an
      # immutable release; on the shared runners that hits the anonymous
      # rate limit and the build stops ("Refusing to download a mutable
      # GitHub release").  curl's config file gives it this job's token
      # (curl drops the header when a redirect leaves github.com; the
      # download itself is checked against the SHA-256 pinned in the crate).
      - name: GitHub token for curl (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$RUNNER_TEMP/curlhome"
          mkdir -p "$d"
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$d/.curlrc"
          cp "$d/.curlrc" "$d/_curlrc"
          echo "CURL_HOME=$d" >> "$GITHUB_ENV"
      # Linux: built with zig against glibc 2.28, so the programs also start
      # on older distributions (RHEL/Rocky 8, Debian 10, Ubuntu 18.04 and
      # newer); the runner's own glibc would make 2.39 the minimum
      - name: Zig (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang cargo-zigbuild
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        # macOS: the formulas compiled at run time are built in, but only
        # used with MB3D_JIT=1 (not tested there yet; the package has
        # clifcheck and jit_check.sh to test them)
        env:
          MB3D_JIT_MACOS: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cargo zigbuild --release --features gpu --target ${{ matrix.target }}.2.28
            # no symbol may need a newer glibc than 2.28
            for exe in Mandelbulb3D mb3d; do
              v=$(objdump -T "target/${{ matrix.target }}/release/$exe" | grep -oE 'GLIBC_[0-9.]+' | sort -t. -k2,2n -k3,3n -u | tail -1)
              echo "$exe needs $v"
              case "$v" in GLIBC_2.[0-9]|GLIBC_2.1[0-9]|GLIBC_2.2[0-8]) ;; *) echo "::error::$exe needs $v"; exit 1;; esac
            done
          else
            cargo build --release --features gpu --target ${{ matrix.target }}
            if [ "${{ runner.os }}" = "macOS" ]; then
              cargo build --release --features gpu --target ${{ matrix.target }} --example clifcheck
            fi
            # the C runtime is linked in (.cargo/config.toml, issue #18): the
            # program must not need the Visual C++ redistributable DLLs
            for exe in Mandelbulb3D mb3d; do
              if grep -a -i -q -E "MSVCP140\.dll|VCRUNTIME140\.dll" "target/${{ matrix.target }}/release/$exe.exe"; then
                echo "::error::$exe imports the Visual C++ runtime DLLs"; exit 1
              fi
            done
          fi
      # Intel's package as it is (the libraries, their licences and
      # documentation), checked against the SHA-256 above
      - name: Intel Open Image Denoise
        shell: bash
        run: |
          f=${{ matrix.oidn }}
          curl -sSfL -o "$f" "https://github.com/RenderKit/oidn/releases/download/v2.5.1/$f"
          if command -v sha256sum > /dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          echo "${{ matrix.oidn_sha }}  $f" | $sum -c -
          mkdir oidn-pkg
          case "$f" in *.zip) 7z x -ooidn-pkg "$f" > /dev/null ;; *) tar xzf "$f" -C oidn-pkg ;; esac
          mv oidn-pkg/oidn-* oidn
          ls oidn
      - name: Package
        shell: bash
        run: |
          name=mb3d-rs-${TAG}-${{ matrix.target }}
          mkdir -p "$name"
          # the folder looks like a Mandelbulb3D installation: the program next
          # to MB3D's data folders and documentation, MB3D's working folders,
          # and the rest of the original repository (Delphi sources, project
          # files) in MB3D-sources/
          (cd mb3d-original && echo "https://github.com/thargor6/mb3d commit $(git rev-parse HEAD)" > ../MB3D-SOURCE.txt)
          rm -rf mb3d-original/.git
          mv mb3d-original "$name/MB3D-sources"
          for item in M3Formulas M3Maps M3Parameter EM_JIT_M3Formulas License.txt CHANGELOG.txt \
                      Mandelbulb3DMSeq.ini Style.vsf README_*.txt *.jpg; do
            for f in "$name"/MB3D-sources/$item; do [ -e "$f" ] && mv "$f" "$name"/; done
          done
          mv "$name/MB3D-sources/README.md" "$name/README-MB3D.md"
          # formulas new in mb3d-rs (calculated by the program itself)
          cp M3Formulas-rs/*.m3f "$name/M3Formulas/"
          for d in History Meshes BigRenders; do mkdir -p "$name/$d"; done
          echo "Parameters of every image calculated with \"Calculate 3D\" (one folder per day), as in MB3D." > "$name/History/README.txt"
          echo "Meshes exported with BTracer2 are saved here, as in MB3D." > "$name/Meshes/README.txt"
          echo "Folder for big renders (tiles), as in MB3D." > "$name/BigRenders/README.txt"
          mv MB3D-SOURCE.txt "$name"/
          # Mandelbulb3D: the windows of MB3D; mb3d: the command line renderer
          for exe in Mandelbulb3D mb3d; do
            cp "target/${{ matrix.target }}/release/$exe${{ matrix.ext }}" "$name"/
          done
          # Intel Open Image Denoise (Apache 2.0, its licences in oidn/doc)
          mv oidn "$name/oidn"
          # macOS: the check of the formulas compiled at run time
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "target/${{ matrix.target }}/release/examples/clifcheck" "$name"/
            cp tools/jit_check.sh "$name"/
          fi
          cp README.md GETTING_STARTED.md LICENSE download.sh "$name"/
          # the application menu entry and its icon (download.sh, the .deb)
          cp assets/mb3d-rs*.png assets/mb3d-rs.desktop "$name"/
          # the man page and the bash, zsh and fish completions, made from the
          # program's own help (download.sh installs them)
          if [ "${{ runner.os }}" != "Windows" ]; then
            mkdir help
            if "$name/mb3d" --version > help/version.txt && "$name/mb3d" --help > help/main.txt; then
              for c in animate batch voxel mesh mutagen montecarlo resume; do "$name/mb3d" $c --help > help/$c.txt; done
              python3 tools/cli_docs.py help "$name"
            else
              echo "::warning::no man page / completions (mb3d does not run on this runner)"
            fi
          fi
          # the themes and the languages (the program reads them from here)
          cp -r Themes "$name"/
          cp -r Languages "$name"/
          mkdir -p "$name/examples"
          cp examples/*.m3s "$name/examples"/
          # the neural noise filter loads from the package (not on the Intel
          # Macs' build, which cannot run here)
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            p=$(ls "$name"/M3Parameter/*.m3p | grep -m1 -i 'apollo')
            MB3D_GPU=0 "$name/mb3d${{ matrix.ext }}" montecarlo "$p" --scale 0.1 --rays 4 --denoise-ai --no-resume -q -o ai-test.png
            test -s ai-test.png
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            # the JIT runs on the runner (a short check, not the whole one)
            MB3D_JIT=1 MB3D_GPU=0 "$name/mb3d" montecarlo "$p" --scale 0.1 --rays 4 --no-resume -q -o jit-test.png
            test -s jit-test.png
          fi
          # the archive name has no version, so that the README can link to
          # releases/latest/download/<archive>
          if [ "${{ runner.os }}" = "Windows" ]; then archive=mb3d-rs-${{ matrix.asset }}.zip; 7z a "$archive" "$name" > /dev/null
          else archive=mb3d-rs-${{ matrix.asset }}.tar.gz; tar czf "$archive" "$name"; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          # Debian/Ubuntu: a .deb of the same folder (programs in /usr/bin,
          # MB3D's folders in /usr/share/mb3d-rs)
          if [ "${{ runner.os }}" = "Linux" ]; then
            v=${TAG#v}
            case "$v" in [0-9]*) ;; *) v=0.0.0~$v ;; esac
            ci/tools/build_deb.sh "$name" "$v" deb
            # without the version, like the archives (the README links to
            # releases/latest/download/mb3d-rs-linux-x64.deb)
            mv deb/mb3d-rs_${v}_amd64.deb mb3d-rs-linux-x64.deb
            echo "DEB=mb3d-rs-linux-x64.deb" >> "$GITHUB_ENV"
            # Fedora, RHEL, openSUSE: an .rpm of the same files
            sudo apt-get install -y rpm > /dev/null
            ci/tools/build_rpm.sh "$name" "$v" rpm
            mv rpm/mb3d-rs-*.x86_64.rpm mb3d-rs-linux-x64.rpm
            echo "RPM=mb3d-rs-linux-x64.rpm" >> "$GITHUB_ENV"
          fi
      # the .deb installed on the runner: the programs, their files in
      # /usr/share/mb3d-rs, the man page
      - name: Try the .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./$DEB"
          mb3d --version
          test -f /usr/share/man/man1/mb3d.1.gz
          mb3d -W 64 -H 48 --cpu -q -o /tmp/t.png "/usr/share/mb3d-rs/M3Parameter/$(ls /usr/share/mb3d-rs/M3Parameter | grep -m1 -i 'apollo.*\.m3p$')"
          test -s /tmp/t.png
          # the neural noise filter from /usr/lib/mb3d-rs/oidn
          MB3D_GPU=0 mb3d montecarlo "/usr/share/mb3d-rs/M3Parameter/$(ls /usr/share/mb3d-rs/M3Parameter | grep -m1 -i 'apollo.*\.m3p$')" --scale 0.1 --rays 4 --denoise-ai --no-resume -q -o /tmp/ai.png
          test -s /tmp/ai.png
          # the user's files are not written next to the programs
          test ! -e /usr/bin/ShaderCache
      # the .rpm installed on the oldest system the programs are made for
      - name: Try the .rpm
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e RPM -v "$PWD:/w" rockylinux:8 sh -ec '
            dnf install -y -q /w/$RPM
            rpm -q mb3d-rs
            mb3d --version
            test -f /usr/share/man/man1/mb3d.1.gz
            f=$(ls /usr/share/mb3d-rs/M3Parameter | grep -m1 -i "apollo.*\.m3p$")
            mb3d -W 64 -H 48 --cpu -q -o /tmp/t.png "/usr/share/mb3d-rs/M3Parameter/$f"
            test -s /tmp/t.png
            MB3D_GPU=0 mb3d montecarlo "/usr/share/mb3d-rs/M3Parameter/$f" --scale 0.1 --rays 4 --denoise-ai --no-resume -q -o /tmp/ai.png
            test -s /tmp/ai.png
            dnf remove -y -q mb3d-rs
            test ! -e /usr/bin/mb3d'
      # one file per artifact (archive: false uploads a single file)
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: ${{ env.DEB }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          path: ${{ env.RPM }}
          archive: false
          if-no-files-found: error
      # a signed record that this archive was built here from this commit
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            ${{ env.DEB }}
            ${{ env.RPM }}
      # uploaded as it is (not zipped again): the artifact is the archive itself
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ARCHIVE }}
          archive: false
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # publish what was built even if one platform failed
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true
      # by hand: the release's own files stay, only the missing ones are added
      - name: Files of the existing release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir old
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir old --pattern 'mb3d-rs*'
          for f in old/*; do mv -f "$f" dist/; done
          ls dist
      # the checksums download.sh verifies before it unpacks an archive
      - name: Checksums
        run: cd dist && sha256sum mb3d-rs* > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        if: inputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "mb3d-rs $TAG" --generate-notes
      - name: Add the missing files to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for f in dist/mb3d-rs*; do
            grep -qxF "$(basename "$f")" <<< "$have" || gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done
          gh release upload "$TAG" dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
